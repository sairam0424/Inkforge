name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop, "feature/**", "pr/**"]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm --filter @inkforge/core test

      - name: TypeScript — core
        run: pnpm --filter @inkforge/core typecheck

      - name: TypeScript — cli
        run: pnpm --filter @inkforge/cli typecheck

      - name: TypeScript — web
        run: cd apps/web && npx tsc --noEmit

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Scan for hardcoded secrets
        run: |
          if grep -r "AKIA[A-Z0-9]\{16\}" packages apps --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "::error::AWS credentials found in source code"
            exit 1
          fi
          echo "✅ No hardcoded AWS credentials found"
